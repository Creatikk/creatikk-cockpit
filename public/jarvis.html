<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#04060f">
<link rel="manifest" href="/jarvis.webmanifest">
<link rel="icon" href="/jarvis-icon.svg" type="image/svg+xml">
<title>Jarvis · Creatikk</title>
<style>
  :root{--bg:#04060f;--panel:rgba(14,19,48,.55);--line:rgba(103,232,249,.14);--ink:#e9f6ff;--muted:#8fa3d4;
    --faint:#4c5885;--cyan:#22d3ee;--cyan2:#67e8f9;--violet:#8b5cf6;--good:#2ed592;--crit:#ff5c7a}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);overflow:hidden;
    font:15px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    display:flex;flex-direction:column}
  /* fond HUD */
  body::before{content:'';position:fixed;inset:0;pointer-events:none;
    background:
      radial-gradient(60% 45% at 50% 30%, rgba(34,211,238,.10), transparent 70%),
      radial-gradient(50% 40% at 50% 110%, rgba(139,92,246,.12), transparent 70%),
      repeating-linear-gradient(0deg, rgba(103,232,249,.028) 0 1px, transparent 1px 44px),
      repeating-linear-gradient(90deg, rgba(103,232,249,.028) 0 1px, transparent 1px 44px)}
  body::after{content:'';position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 160px rgba(0,0,0,.85)}

  header{padding:calc(14px + env(safe-area-inset-top)) 20px 8px;display:flex;align-items:baseline;gap:12px;z-index:2}
  header h1{font-size:16px;font-weight:800;letter-spacing:.42em;color:var(--cyan2);text-shadow:0 0 18px rgba(34,211,238,.55)}
  header .date{font-size:11.5px;color:var(--faint);letter-spacing:.08em;text-transform:capitalize}
  header a{margin-left:auto;color:var(--faint);font-size:11px;text-decoration:none;letter-spacing:.05em}

  /* ORBE réacteur */
  .stage{display:flex;flex-direction:column;align-items:center;padding:6px 0 2px;z-index:2}
  .reactor{position:relative;width:168px;height:168px;cursor:pointer;flex:none}
  .ring{position:absolute;inset:0;border-radius:50%}
  .r1{border:2px dashed rgba(34,211,238,.5);animation:spin 14s linear infinite}
  .r2{inset:16px;border:1.6px solid transparent;border-top-color:var(--cyan);border-right-color:rgba(34,211,238,.25);animation:spin 5s linear infinite}
  .r3{inset:30px;border:1.4px dashed rgba(139,92,246,.55);animation:spinBack 9s linear infinite}
  .core{position:absolute;inset:46px;border-radius:50%;
    background:radial-gradient(circle at 50% 42%, #eafcff 0%, #8ceefb 30%, #22d3ee 62%, #0a6c86 100%);
    box-shadow:0 0 46px rgba(34,211,238,.55), 0 0 130px rgba(34,211,238,.28), inset 0 0 26px rgba(255,255,255,.5);
    animation:breath 3.4s ease-in-out infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes spinBack{to{transform:rotate(-360deg)}}
  @keyframes breath{0%,100%{transform:scale(1);filter:brightness(1)}50%{transform:scale(1.045);filter:brightness(1.14)}}
  .reactor.thinking .r2{animation-duration:1.1s}
  .reactor.thinking .r3{animation-duration:2.2s}
  .reactor.speaking .core{animation:breath 0.85s ease-in-out infinite}
  .reactor.listening .core{background:radial-gradient(circle at 50% 42%, #ffe9f0 0%, #ffadc2 30%, #ff5c7a 62%, #7a1230 100%);
    box-shadow:0 0 46px rgba(255,92,122,.5), inset 0 0 26px rgba(255,255,255,.5)}
  /* onde vocale */
  .wave{display:flex;gap:4px;align-items:center;height:26px;margin-top:12px;visibility:hidden}
  .wave i{display:block;width:4px;height:6px;border-radius:3px;background:var(--cyan);opacity:.9}
  .speaking-on .wave{visibility:visible}
  .speaking-on .wave i{animation:wv 0.9s ease-in-out infinite}
  .wave i:nth-child(2){animation-delay:.12s}.wave i:nth-child(3){animation-delay:.24s}
  .wave i:nth-child(4){animation-delay:.36s}.wave i:nth-child(5){animation-delay:.48s}
  .wave i:nth-child(6){animation-delay:.6s}.wave i:nth-child(7){animation-delay:.72s}
  @keyframes wv{0%,100%{height:6px}50%{height:24px}}
  .status{margin-top:6px;font-size:12px;color:var(--muted);letter-spacing:.04em;min-height:19px;text-align:center;padding:0 20px}

  /* transcript */
  .chat{flex:1;overflow-y:auto;padding:14px 18px calc(120px + env(safe-area-inset-bottom));z-index:1;
    display:flex;flex-direction:column;gap:10px;max-width:720px;width:100%;margin:0 auto;scroll-behavior:smooth}
  .msg{max-width:88%;padding:12px 15px;border-radius:16px;font-size:14px;white-space:pre-wrap;line-height:1.65;
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  .msg.me{align-self:flex-end;background:rgba(139,92,246,.16);border:1px solid rgba(139,92,246,.3);border-bottom-right-radius:5px}
  .msg.jv{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:5px;color:#cfe3ff}
  .msg.jv b{color:var(--cyan2)}
  .msg .replay{display:inline-block;margin-top:8px;font-size:11.5px;color:var(--cyan);cursor:pointer;letter-spacing:.03em}

  /* dock */
  .dock{position:fixed;left:0;right:0;bottom:0;z-index:3;padding:10px 14px calc(12px + env(safe-area-inset-bottom));
    background:linear-gradient(transparent, rgba(4,6,15,.92) 30%)}
  .dockin{max-width:720px;margin:0 auto;display:flex;gap:8px;align-items:center;
    background:rgba(10,14,36,.8);border:1px solid var(--line);border-radius:20px;padding:8px;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 8px 40px rgba(0,0,0,.5)}
  .dockin input{flex:1;background:transparent;border:none;outline:none;color:var(--ink);font-size:14.5px;padding:8px 10px;min-width:0}
  .dockin input::placeholder{color:var(--faint)}
  .ib{flex:none;width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:rgba(34,211,238,.08);
    color:var(--cyan2);font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .ib.primary{background:linear-gradient(135deg,#22d3ee,#8b5cf6);border-color:transparent;color:#fff}
  .ib.rec{background:rgba(255,92,122,.2);border-color:rgba(255,92,122,.5);color:#ffb3c2;animation:blink 1s ease-in-out infinite}
  @keyframes blink{50%{opacity:.55}}
</style>
</head>
<body>
  <header>
    <h1>J.A.R.V.I.S</h1>
    <span class="date" id="date"></span>
    <a href="/" id="cockpitlink">cockpit →</a>
  </header>

  <div class="stage">
    <div class="reactor" id="reactor" title="Toucher : écouter / couper">
      <div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div>
      <div class="core"></div>
    </div>
    <div class="wave" id="wave"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div class="status" id="status">Initialisation…</div>
  </div>

  <div class="chat" id="chat"></div>

  <div class="dock">
    <div class="dockin">
      <button class="ib primary" id="btnBrief" title="Briefing du jour">☀️</button>
      <input id="q" placeholder="Parle-moi ou écris… (« retiens que… » pour ma mémoire)" autocomplete="off">
      <button class="ib" id="btnMic" title="Micro">🎙</button>
      <button class="ib" id="btnStop" title="Couper la voix">■</button>
    </div>
  </div>

<script>
const $ = (id) => document.getElementById(id);
const reactor = $("reactor"), st = $("status"), chat = $("chat"), body = document.body;
$("date").textContent = new Date().toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});

// --- accès sans mot de passe : jeton dans l'URL une fois, mémorisé ensuite ---
const urlTok = new URLSearchParams(location.search).get("token");
if (urlTok) localStorage.setItem("jarvis_token", urlTok);
const TOK = localStorage.getItem("jarvis_token") || "";
if (TOK) $("cockpitlink").href = "/?token=" + encodeURIComponent(TOK);
const api = (p) => p + (p.includes("?") ? "&" : "?") + (TOK ? "token=" + encodeURIComponent(TOK) : "");

// --- états visuels ---
function setState(mode, msg){
  reactor.classList.remove("thinking","speaking","listening");
  body.classList.remove("speaking-on");
  if (mode === "speaking"){ reactor.classList.add("speaking"); body.classList.add("speaking-on"); }
  else if (mode) reactor.classList.add(mode);
  if (msg !== undefined) st.textContent = msg;
}
function addMsg(kind, text){
  const el = document.createElement("div");
  el.className = "msg " + kind;
  el.textContent = text;
  if (kind === "jv"){
    const r = document.createElement("span");
    r.className = "replay"; r.textContent = "▶ réécouter";
    r.onclick = () => speak(text);
    el.appendChild(document.createElement("br")); el.appendChild(r);
  }
  chat.appendChild(el); chat.scrollTop = chat.scrollHeight;
}

// --- voix : ElevenLabs via le serveur, secours = voix du navigateur ---
const player = new Audio();
// Déblocage audio : au 1er toucher, on joue un silence — ensuite le navigateur autorise
// la lecture même si la génération de la voix prend quelques secondes.
const SILENCE = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=";
let unlocked = false;
function unlock(){
  if (unlocked) return; unlocked = true;
  try{ player.src = SILENCE; player.play().then(()=>player.pause()).catch(()=>{}); }catch(e){}
}
document.addEventListener("pointerdown", unlock, { once:true, capture:true });
player.onplay = () => setState("speaking", "Jarvis parle — touche le réacteur pour couper.");
player.onended = () => setState(null, "À ton écoute.");
player.onerror = () => setState(null, "Lecture audio impossible.");
let voiceFR = null;
function pickVoice(){ const vs = speechSynthesis.getVoices();
  voiceFR = vs.find(v=>/fr[-_]/i.test(v.lang) && /Amelie|Amélie|Thomas|Google/i.test(v.name)) || vs.find(v=>/^fr/i.test(v.lang)) || null; }
if ("speechSynthesis" in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speakFallback(text){
  if (!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "fr-FR"; if (voiceFR) u.voice = voiceFR; u.rate = 1.03;
  u.onstart = () => setState("speaking", "Jarvis parle (voix de secours).");
  u.onend = () => setState(null, "À ton écoute.");
  speechSynthesis.speak(u);
}
async function speak(text, readyUrl){
  stopVoice();
  try{
    let url = readyUrl;
    if (!url){
      setState("thinking", "Préparation de la voix…");
      const r = await fetch(api("/api/tts"), { method:"POST", headers:{ "content-type":"application/json" }, body: JSON.stringify({ text }) });
      const j = await r.json();
      if (!j.url) throw new Error(j.error || "pas d’audio");
      url = j.url;
    }
    player.src = url; await player.play();
  }catch(e){ speakFallback(text); }
}
function stopVoice(){ try{ player.pause(); player.currentTime = 0; }catch(e){} if ("speechSynthesis" in window) speechSynthesis.cancel(); }

// --- cerveau ---
let lastText = "", lastAudio = null;
async function getBrief(force){
  setState("thinking", "J’analyse tes chiffres…");
  try{
    const r = await fetch(api("/api/brief" + (force ? "?force=1" : "")));
    const j = await r.json();
    if (j.error) throw new Error(j.error);
    lastText = j.text; lastAudio = j.audioUrl || null;
    addMsg("jv", j.text); speak(j.text, lastAudio);
  }catch(e){ setState(null, "Erreur : " + e.message); }
}
async function ask(question){
  question = (question || "").trim();
  if (!question) return;
  addMsg("me", question);
  setState("thinking", "Je réfléchis…");
  try{
    const r = await fetch(api("/api/ask"), { method:"POST", headers:{ "content-type":"application/json" }, body: JSON.stringify({ q: question }) });
    const j = await r.json();
    if (j.error) throw new Error(j.error);
    lastText = j.text; addMsg("jv", j.text); speak(j.text);
  }catch(e){ setState(null, "Erreur : " + e.message); }
}

// --- micro ---
let rec = null;
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SR){
  rec = new SR(); rec.lang = "fr-FR"; rec.interimResults = false; rec.maxAlternatives = 1;
  rec.onresult = (e) => ask(e.results[0][0].transcript);
  rec.onerror = () => setState(null, "Je n’ai rien entendu — réessaie.");
  rec.onend = () => { $("btnMic").classList.remove("rec"); reactor.classList.remove("listening"); };
}
$("btnMic").onclick = () => {
  if (!rec){ setState(null, "Micro indisponible ici — utilise la dictée du clavier dans le champ texte."); $("q").focus(); return; }
  stopVoice(); $("btnMic").classList.add("rec"); setState("listening", "Je t’écoute…"); rec.start();
};

reactor.onclick = () => {
  if (!player.paused || ("speechSynthesis" in window && speechSynthesis.speaking)){ stopVoice(); setState(null, "Coupé."); }
  else if (lastText) speak(lastText, lastAudio);
  else getBrief(false);
};
$("btnBrief").onclick = () => getBrief(false);
$("btnStop").onclick = () => { stopVoice(); setState(null, "Coupé."); };
$("q").addEventListener("keydown", (e) => { if (e.key === "Enter"){ ask($("q").value); $("q").value = ""; } });

// --- démarrage : briefing pré-chargé (texte direct, voix au premier geste) ---
(async () => {
  try{
    const r = await fetch(api("/api/brief"));
    const j = await r.json();
    if (j.text){ lastText = j.text; lastAudio = j.audioUrl || null; addMsg("jv", j.text); setState(null, "Briefing prêt — touche le réacteur pour l’écouter."); }
    else setState(null, "Erreur : " + (j.error || "?"));
  }catch(e){ setState(null, "Serveur injoignable — vérifie ta connexion."); }
})();
</script>
</body>
</html>
